<!DOCTYPE html>
<html>
  <head>
    <title>Peces en círculo con Hiro</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/2.2.1/aframe/build/aframe-ar.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene embedded arjs>
      <!-- Usamos marcador Hiro -->
      <a-marker preset="hiro">

        <!-- Grupo de peces -->
        <a-entity id="banco" rotation="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">

          <!-- Pez 1 -->
          <a-entity 
            gltf-model="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/Goldfish/glTF/Goldfish.gltf"
            scale="0.05 0.05 0.05"
            position="0.5 0 0">
          </a-entity>

          <!-- Pez 2 -->
          <a-entity 
            gltf-model="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/Goldfish/glTF/Goldfish.gltf"
            scale="0.04 0.04 0.04"
            position="-0.5 0 0">
          </a-entity>

          <!-- Pez 3 -->
          <a-entity 
            gltf-model="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/Goldfish/glTF/Goldfish.gltf"
            scale="0.06 0.06 0.06"
            position="0 0.5 0">
          </a-entity>

          <!-- Pez 4 -->
          <a-entity 
            gltf-model="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/Goldfish/glTF/Goldfish.gltf"
            scale="0.03 0.03 0.03"
            position="0 -0.5 0">
          </a-entity>

        </a-entity>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
