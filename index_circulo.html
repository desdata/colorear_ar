<!DOCTYPE html>
<html>
  <head>
    <title>Prueba Pez Animado con cámara corregida</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/master/aframe/build/aframe-ar.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <!-- Marcador Hiro (puedes cambiar a tu .patt después) -->
      <a-marker preset="hiro">
        <a-entity 
          gltf-model="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/Goldfish/glTF/Goldfish.gltf"
          scale="0.05 0.05 0.05"
          position="0 0 0"
          rotation="0 90 0"
          animation="property: position; to: 0 0.2 0; dir: alternate; dur: 1000; loop: true"
          animation__2="property: rotation; to: 0 20 0; dir: alternate; dur: 800; loop: true">
        </a-entity>
      </a-marker>
      <!-- Cámara fija (corrige perspectiva rara) -->
      <a-entity camera="active: true" look-controls-enabled="false"></a-entity>
    </a-scene>
  </body>
</html>
