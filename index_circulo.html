<!DOCTYPE html>
<html>
  <head>
    <title>Prueba cámara con AR.js</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/master/aframe/build/aframe-ar.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene embedded arjs>
      <!-- Marcador Hiro para test -->
      <a-marker preset="hiro">
        <a-box color="blue" depth="0.3" height="0.3" width="0.3" position="0 0.15 0"></a-box>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
