<!DOCTYPE html>
<html>
  <head>
    <title>AR Video con Pez</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/2.2.1/aframe/build/aframe-ar.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene embedded arjs>
      <!-- Usamos marcador Hiro para pruebas -->
      <a-marker preset="hiro">
        <a-entity 
          gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Goldfish/glTF-Binary/Goldfish.glb"
          scale="0.05 0.05 0.05"
          position="0 1.5 -3"
          rotation="0 90 0"
          animation="property: position; to: 0 1.8 -3; dir: alternate; dur: 1200; loop: true"
          animation__2="property: rotation; to: 0 110 0; dir: alternate; dur: 1500; loop: true">
        </a-entity>
      </a-marker>
