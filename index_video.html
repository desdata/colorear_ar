<!DOCTYPE html>
<html>
  <head>
    <title>Vista Pez Animado</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <style>
      body { margin: 0; }
      a-scene { height: 100vh; width: 100vw; }
    </style>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <!-- Modelo de pez -->
        <a-asset-item id="fish" src="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/Goldfish/glTF/Goldfish.gltf"></a-asset-item>
      </a-assets>

      <!-- Pez animado -->
      <a-entity gltf-model="#fish"
                scale="0.05 0.05 0.05"
                position="0 1.5 -3"
                rotation="0 90 0"
                animation="property: position; to: 0 1.8 -3; dir: alternate; dur: 1200; loop: true"
                animation__2="property: rotation; to: 0 110 0; dir: alternate; dur: 1500; loop: true">
      </a-entity>

      <!-- Cámara libre -->
      <a-entity camera look-controls></a-entity>
    </a-scene>
  </body>
</html>
